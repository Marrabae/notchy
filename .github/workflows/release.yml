name: Release

# Rilis dibuat saat tag versi didorong, mis. `git tag v0.3.0 && git push origin v0.3.0`.
# Versi di Cargo.toml harus sama dengan tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cek versi tag = Cargo.toml
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          c=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          [ "$v" = "$c" ] || { echo "tag $v != Cargo.toml $c"; exit 1; }
      - run: cargo build --release --locked
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DBuildDir=$PWD\target\release" installer\notchy.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/notchy-setup-*.exe

  linux:
    # baseline glibc = Ubuntu 24.04 LTS (2.39); jangan pakai ubuntu-latest, binary jadi butuh glibc terbaru
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cek versi tag = Cargo.toml
        run: |
          v="${GITHUB_REF_NAME#v}"
          c=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          [ "$v" = "$c" ] || { echo "tag $v != Cargo.toml $c"; exit 1; }
      - run: cargo build --release --locked
      - name: Cek baseline glibc (maks 2.39)
        run: |
          max=$(objdump -T target/release/notchy | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "glibc maksimum yang dibutuhkan binary: $max"
          [ "$(printf '%s\n' "$max" 2.39 | sort -V | tail -1)" = "2.39" ] || { echo "binary butuh glibc $max > 2.39"; exit 1; }
      - name: Paket .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build
      - name: Tarball
        run: |
          v="${GITHUB_REF_NAME#v}"
          d="notchy-$v-linux-x86_64"
          mkdir -p "$d"
          cp target/release/notchy packaging/linux/install.sh packaging/linux/notchy.desktop assets/notchy.png README.md "$d/"
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/debian/*.deb
            notchy-*-linux-x86_64.tar.gz

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
